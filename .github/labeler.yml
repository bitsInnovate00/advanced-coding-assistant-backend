vscode-extension:
  - changed-files:
    - any-glob-to-any-file: 'advanced-coding-assistant-vscode/**/*'

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - '**/package.json'
      - '**/package-lock.json'

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - '**/README.*'
      - '**/CHANGELOG.*'

github-actions:
  - changed-files:
    - any-glob-to-any-file: '.github/**/*'

tests:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.test.ts'
      - '**/*.spec.ts'
      - '**/test/**/*'
