name: Release VS Code Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-and-package:
    name: Build and Package VSIX
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: advanced-coding-assistant-vscode

    outputs:
      version: ${{ steps.get-version.outputs.version }}
      vsix-name: ${{ steps.package.outputs.vsix-name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: advanced-coding-assistant-vscode/package-lock.json

    - name: Get version from package.json
      id: get-version
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run tests
      uses: coactions/setup-xvfb@v1
      with:
        run: npm test
        working-directory: advanced-coding-assistant-vscode

    - name: Install vsce
      run: npm install -g @vscode/vsce

    - name: Package extension
      id: package
      run: |
        vsce package
        VSIX_FILE=$(ls *.vsix)
        echo "vsix-name=$VSIX_FILE" >> $GITHUB_OUTPUT
        echo "Packaged: $VSIX_FILE"

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: vscode-extension-release
        path: advanced-coding-assistant-vscode/*.vsix
        if-no-files-found: error
        retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-package
    
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Download VSIX artifact
      uses: actions/download-artifact@v4
      with:
        name: vscode-extension-release
        path: ./vsix

    - name: Extract release notes from CHANGELOG
      id: release-notes
      run: |
        VERSION="${{ needs.build-and-package.outputs.version }}"
        
        # Extract release notes for this version from CHANGELOG
        if [ -f "advanced-coding-assistant-vscode/CHANGELOG.md" ]; then
          # Try to extract the section for this version
          NOTES=$(sed -n "/## \[${VERSION}\]/,/## \[/p" advanced-coding-assistant-vscode/CHANGELOG.md | sed '$d' | tail -n +2)
          
          if [ -z "$NOTES" ]; then
            NOTES="Release version ${VERSION}"
          fi
        else
          NOTES="Release version ${VERSION}"
        fi
        
        # Save to file for the release
        echo "$NOTES" > release-notes.md
        
        echo "Release notes:"
        cat release-notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        name: Release ${{ needs.build-and-package.outputs.version }}
        body_path: release-notes.md
        draft: false
        prerelease: false
        files: |
          vsix/*.vsix
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-marketplace:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [build-and-package, create-release]
    environment: 
      name: marketplace-production
      url: https://marketplace.visualstudio.com/items?itemName=bitsInnovate00.advanced-coding-assistant
    
    defaults:
      run:
        working-directory: advanced-coding-assistant-vscode

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Download VSIX artifact
      uses: actions/download-artifact@v4
      with:
        name: vscode-extension-release
        path: advanced-coding-assistant-vscode

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install vsce
      run: npm install -g @vscode/vsce

    - name: Publish to VS Code Marketplace
      if: ${{ secrets.VSCE_TOKEN != '' }}
      run: |
        VSIX_FILE=$(ls *.vsix)
        vsce publish --packagePath "$VSIX_FILE"
      env:
        VSCE_PAT: ${{ secrets.VSCE_TOKEN }}

    - name: Publish Summary
      run: |
        echo "## Marketplace Publication" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ secrets.VSCE_TOKEN }}" ]; then
          echo "✅ Extension published to VS Code Marketplace" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.build-and-package.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** ${{ needs.build-and-package.outputs.vsix-name }}" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ VSCE_TOKEN not configured - skipping marketplace publication" >> $GITHUB_STEP_SUMMARY
          echo "To enable automated publishing, add VSCE_TOKEN to repository secrets" >> $GITHUB_STEP_SUMMARY
        fi
