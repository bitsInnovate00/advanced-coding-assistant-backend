name: Version Bump and Changelog

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      changelog-entry:
        description: 'Changelog entry (optional - will auto-generate from commits)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: advanced-coding-assistant-vscode

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: advanced-coding-assistant-vscode/package-lock.json

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get current version
      id: current-version
      run: |
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

    - name: Bump version
      id: bump
      run: |
        npm version ${{ inputs.version-type }} --no-git-tag-version
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Generate changelog entry
      id: changelog
      run: |
        NEW_VERSION="${{ steps.bump.outputs.new-version }}"
        CURRENT_DATE=$(date +%Y-%m-%d)
        
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          COMMITS=$(git log --pretty=format:"- %s" --no-merges)
        else
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges)
        fi
        
        # Create changelog entry
        if [ -n "${{ inputs.changelog-entry }}" ]; then
          CHANGELOG_CONTENT="${{ inputs.changelog-entry }}"
        else
          CHANGELOG_CONTENT="### Changes\n\n${COMMITS}"
        fi
        
        # Create temp file with new content
        {
          # Print everything up to and including the Unreleased header
          sed -n '1,/## \[Unreleased\]/p' CHANGELOG.md
          # Add blank line
          echo ""
          # Add new version section
          echo "## [${NEW_VERSION}] - ${CURRENT_DATE}"
          echo ""
          echo -e "${CHANGELOG_CONTENT}"
          echo ""
          # Skip to the first existing version section (skip Unreleased content)
          sed -n '/## \[Unreleased\]/,/## \[[0-9]/{ /## \[[0-9]/,$ p }' CHANGELOG.md | grep -v "^$" || sed -n '/## \[Unreleased\]/,${/^$/!{/## \[Unreleased\]/!p}}' CHANGELOG.md
        } > CHANGELOG.tmp
        
        mv CHANGELOG.tmp CHANGELOG.md
        
        echo "Updated CHANGELOG.md with version ${NEW_VERSION}"

    - name: Commit changes
      run: |
        git add package.json package-lock.json CHANGELOG.md
        git commit -m "chore: bump version to ${{ steps.bump.outputs.new-version }}"
        git tag "v${{ steps.bump.outputs.new-version }}"

    - name: Push changes
      run: |
        git push origin HEAD:${{ github.ref_name }}
        git push origin "v${{ steps.bump.outputs.new-version }}"

    - name: Create Pull Request Summary
      run: |
        echo "## Version Bump Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Previous Version:** ${{ steps.current-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **New Version:** ${{ steps.bump.outputs.new-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Bump Type:** ${{ inputs.version-type }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "The version bump has been committed and tagged. The release workflow will be triggered automatically." >> $GITHUB_STEP_SUMMARY
